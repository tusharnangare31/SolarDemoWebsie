    <rect x="12" y="12" width="416" height="316" rx="6" fill="#090d16"/>
    
    <!-- 4x3 Solar Cells Array -->
    
      <rect x="22" y="22" width="94" height="94" rx="4" fill="url(#cell)" opacity="0.9"/>
      <line x1="22" y1="69" x2="116" y2="69" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <line x1="69" y1="22" x2="69" y2="116" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    
      <rect x="122" y="22" width="94" height="94" rx="4" fill="url(#cell)" opacity="0.9"/>
      <line x1="122" y1="69" x2="216" y2="69" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <line x1="169" y1="22" x2="169" y2="116" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    
      <rect x="222" y="22" width="94" height="94" rx="4" fill="url(#cell)" opacity="0.9"/>
      <line x1="222" y1="69" x2="316" y2="69" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <line x1="269" y1="22" x2="269" y2="116" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    
      <rect x="322" y="22" width="94" height="94" rx="4" fill="url(#cell)" opacity="0.9"/>

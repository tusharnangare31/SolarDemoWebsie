  <!-- Windows on Building -->
  
    <rect x="150" y="250" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="235" y="250" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="320" y="250" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="405" y="250" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="490" y="250" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="575" y="250" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="150" y="320" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="235" y="320" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  
    <rect x="320" y="320" width="50" height="45" rx="4" fill="#94a3b8" opacity="0.8"/>
  

      <polygon points="20,31 75,31 70,21 15,21" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="80,31 135,31 130,21 75,21" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="140,31 195,31 190,21 135,21" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="200,31 255,31 250,21 195,21" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="260,31 315,31 310,21 255,21" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    

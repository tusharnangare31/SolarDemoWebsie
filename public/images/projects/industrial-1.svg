      <polygon points="80,17 135,17 130,7 75,7" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="140,17 195,17 190,7 135,7" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="200,17 255,17 250,7 195,7" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="260,17 315,17 310,7 255,7" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    
      <polygon points="320,17 375,17 370,7 315,7" fill="url(#p-cell)" stroke="#93c5fd" stroke-width="1"/>
    

  <rect x="0" y="470" width="800" height="130" fill="#0f172a"/>
  <text x="50" y="515" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">Patel Manufacturing Unit</text>
  <text x="50" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">📍 Ahmedabad, Gujarat</text>

  <!-- Sector & Capacity Pills -->
  <g transform="translate(600, 495)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#f59e0b"/>
    <text x="75" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Industrial • 500 kW</text>
